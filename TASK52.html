<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const letters = ['a', 'b', 'a', 'c', 'b', 'a'];

        function countOccurrences(arr, letter) {
            let count = 0;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] === letter) {
                    count++;
                }
            }
            return count;
        }

        const countOfA = countOccurrences(letters, 'a');
        console.log(countOfA);
    </script>
    
</body>
</html>
