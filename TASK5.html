<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 5;
        let b = 10;
        console.log("before swap: a = " + a, "b =" + b,)
        const temp = a;
        a = b;
        b = temp;
        console.log("After swap: a is = " + a, "b is = " + temp)
    </script>
    
</body>
</html>
