<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        let totalSum = 0;
        for (let i = 1; i <= 100; i++){
            totalSum += i;
        }
        console.log("The sum of numbers 1 to 100 is " + totalSum);
    </script>
    
</body>
