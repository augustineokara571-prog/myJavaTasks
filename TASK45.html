<!DOCTYPE html>
<html lang="en">

<body>
    <script>
        function findMaxNumber(numbers) {

            let max = numbers[0];

            for (let i = 1; i < numbers.length; i++) {
                if (numbers[i] > max) {
                    max = numbers[i];
                }
            }
            return max;
        }


        const sampleNumbers = [13, 45, 7, 88, 23, 55];

        const maxNumber = findMaxNumber(sampleNumbers);
        console.log(maxNumber);
    </script>
    
</body>
</html>
